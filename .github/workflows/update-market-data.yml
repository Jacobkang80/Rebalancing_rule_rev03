name: Update Market Data

on:
  schedule:
    # 15:40 KST = 06:40 UTC, weekdays
    - cron: "40 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas finance-datareader

      - name: Update market data
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python <<'PY'
          import csv
          import io
          import json
          import math
          import os
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone

          import pandas as pd
          import requests
          import FinanceDataReader as fdr

          WATCHLIST_FILE = "watchlist.json"
          OUTPUT_FILE = "market-data.json"

          BB_PERIOD = 20
          BB_MULTIPLIER = 2.5
          MAX_WORKERS = 6

          YAHOO_BASES = [
              "https://query1.finance.yahoo.com/v8/finance/chart/",
              "https://query2.finance.yahoo.com/v8/finance/chart/",
          ]

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/131.0 Safari/537.36"
              ),
              "Accept": "application/json,text/plain,*/*",
          }

          session = requests.Session()
          session.headers.update(HEADERS)


          def safe_float(value):
              try:
                  if value is None:
                      return None
                  value = float(value)
                  return value if math.isfinite(value) else None
              except Exception:
                  return None


          def calculate_bb(values):
              values = [safe_float(x) for x in values]
              values = [x for x in values if x is not None]

              if len(values) < BB_PERIOD:
                  return {
                      "middle": None,
                      "upper": None,
                      "lower": None,
                  }

              arr = values[-BB_PERIOD:]
              mean = sum(arr) / len(arr)
              variance = sum((x - mean) ** 2 for x in arr) / len(arr)
              std = math.sqrt(variance)

              return {
                  "middle": mean,
                  "upper": mean + BB_MULTIPLIER * std,
                  "lower": mean - BB_MULTIPLIER * std,
              }


          def get_chart(symbol, range_="6mo"):
              last_error = None

              for base in YAHOO_BASES:
                  url = base + requests.utils.quote(symbol, safe="")
                  params = {
                      "interval": "1d",
                      "range": range_,
                      "events": "div,splits",
                      "includeAdjustedClose": "true",
                  }

                  for attempt in range(4):
                      try:
                          response = session.get(
                              url,
                              params=params,
                              timeout=25,
                          )

                          if response.status_code == 429:
                              time.sleep(3 + attempt * 4)
                              continue

                          response.raise_for_status()
                          data = response.json()

                          chart = data.get("chart", {})
                          results = chart.get("result")

                          if not results:
                              error = chart.get("error")
                              raise RuntimeError(
                                  f"No Yahoo result: {error}"
                              )

                          result = results[0]
                          timestamps = result.get("timestamp", [])

                          quote = (
                              result.get("indicators", {})
                              .get("quote", [{}])[0]
                          )

                          closes = quote.get("close", [])

                          rows = []

                          for ts, close in zip(timestamps, closes):
                              close = safe_float(close)
                              if close is None:
                                  continue

                              rows.append({
                                  "timestamp": int(ts),
                                  "close": close,
                              })

                          meta = result.get("meta", {})
                          price = safe_float(
                              meta.get("regularMarketPrice")
                          )

                          if price is None and rows:
                              price = rows[-1]["close"]

                          if price is None or len(rows) < BB_PERIOD:
                              raise RuntimeError(
                                  f"Insufficient Yahoo data: {symbol}"
                              )

                          return {
                              "price": price,
                              "rows": rows,
                          }

                      except Exception as exc:
                          last_error = exc
                          if attempt < 3:
                              time.sleep(1.5 + attempt * 2)

                  time.sleep(0.5)

              raise RuntimeError(
                  f"Yahoo Finance failed for {symbol}: {last_error}"
              )


          def weekly_closes(rows):
              grouped = {}

              for row in rows:
                  dt = datetime.fromtimestamp(
                      row["timestamp"],
                      tz=timezone.utc,
                  )
                  iso = dt.isocalendar()
                  key = (iso.year, iso.week)
                  grouped[key] = row["close"]

              return list(grouped.values())


          def build_symbol(item):
              ticker = item["ticker"]

              try:
                  daily = get_chart(ticker)
                  rows = daily["rows"]

                  daily_values = [x["close"] for x in rows]
                  weekly_values = weekly_closes(rows)

                  return {
                      "ticker": ticker,
                      "name": item.get("name", ticker),
                      "nameKo": item.get(
                          "nameKo",
                          item.get("name", ticker),
                      ),
                      "nameEn": item.get(
                          "nameEn",
                          item.get("english", item.get("name", ticker)),
                      ),
                      "market": item.get("market", ""),
                      "universe": item.get("universe", "WATCHLIST"),
                      "price": daily["price"],
                      "daily": calculate_bb(daily_values),
                      "weekly": calculate_bb(weekly_values),
                      "dataPoints": len(rows),
                  }

              except Exception as exc:
                  print(f"STOCK ERROR | {ticker} | {exc}")

                  return {
                      "ticker": ticker,
                      "name": item.get("name", ticker),
                      "nameKo": item.get(
                          "nameKo",
                          item.get("name", ticker),
                      ),
                      "nameEn": item.get(
                          "nameEn",
                          item.get("english", item.get("name", ticker)),
                      ),
                      "market": item.get("market", ""),
                      "universe": item.get("universe", "WATCHLIST"),
                      "price": None,
                      "daily": {
                          "middle": None,
                          "upper": None,
                          "lower": None,
                      },
                      "weekly": {
                          "middle": None,
                          "upper": None,
                          "lower": None,
                      },
                      "dataPoints": 0,
                      "error": str(exc),
                  }


          def normalize_watchlist_item(item):
              if not isinstance(item, dict):
                  return None

              ticker = (
                  item.get("ticker")
                  or item.get("symbol")
                  or item.get("yfTicker")
              )

              if not ticker:
                  return None

              return {
                  "ticker": str(ticker).strip(),
                  "name": str(
                      item.get("name")
                      or item.get("nameKo")
                      or item.get("english")
                      or ticker
                  ),
                  "nameKo": str(
                      item.get("nameKo")
                      or item.get("name")
                      or ticker
                  ),
                  "nameEn": str(
                      item.get("nameEn")
                      or item.get("english")
                      or item.get("name")
                      or ticker
                  ),
                  "market": str(item.get("market") or ""),
                  "universe": "WATCHLIST",
              }


          def load_watchlist():
              with open(
                  WATCHLIST_FILE,
                  "r",
                  encoding="utf-8",
              ) as f:
                  data = json.load(f)

              stocks = []
              indices = []

              if isinstance(data, list):
                  stocks = [
                      normalize_watchlist_item(x)
                      for x in data
                  ]
                  stocks = [x for x in stocks if x]

              elif isinstance(data, dict):
                  raw_stocks = data.get("stocks", [])
                  raw_indices = data.get("indices", [])

                  stocks = [
                      normalize_watchlist_item(x)
                      for x in raw_stocks
                  ]
                  stocks = [x for x in stocks if x]

                  for item in raw_indices:
                      if not isinstance(item, dict):
                          continue
                      ticker = (
                          item.get("ticker")
                          or item.get("symbol")
                      )
                      if not ticker:
                          continue

                      indices.append({
                          "ticker": str(ticker).strip(),
                          "name": str(
                              item.get("name")
                              or item.get("english")
                              or ticker
                          ),
                          "nameKo": str(
                              item.get("nameKo")
                              or item.get("name")
                              or ticker
                          ),
                          "nameEn": str(
                              item.get("nameEn")
                              or item.get("english")
                              or item.get("name")
                              or ticker
                          ),
                          "market": "INDEX",
                      })

              return stocks, indices


          def load_kospi_top500():
              print("")
              print("=" * 70)
              print("KOSPI TOP 500")
              print("=" * 70)

              last_error = None

              for attempt in range(3):
                  try:
                      df = fdr.StockListing("KOSPI")

                      if df is None or df.empty:
                          raise RuntimeError("KOSPI listing is empty")

                      df = df.copy()

                      symbol_col = next(
                          (
                              c for c in df.columns
                              if str(c).lower() in {
                                  "symbol", "code", "ticker"
                              }
                          ),
                          None,
                      )

                      name_col = next(
                          (
                              c for c in df.columns
                              if str(c).lower() in {
                                  "name", "종목명"
                              }
                          ),
                          None,
                      )

                      if symbol_col is None:
                          raise RuntimeError(
                              f"Cannot find KOSPI symbol column: "
                              f"{list(df.columns)}"
                          )

                      if name_col is None:
                          name_col = symbol_col

                      # FinanceDataReader의 KOSPI listing은
                      # 시가총액 관련 열이 제공되는 버전이 있으므로
                      # 가능한 경우 시가총액 기준으로 다시 정렬합니다.
                      marcap_col = next(
                          (
                              c for c in df.columns
                              if str(c).lower() in {
                                  "marcap",
                                  "marketcap",
                                  "market_cap",
                                  "시가총액",
                              }
                          ),
                          None,
                      )

                      if marcap_col:
                          df[marcap_col] = pd.to_numeric(
                              df[marcap_col],
                              errors="coerce",
                          )
                          df = df.sort_values(
                              marcap_col,
                              ascending=False,
                              na_position="last",
                          )

                      result = []
                      seen = set()

                      for _, row in df.iterrows():
                          raw_symbol = str(
                              row.get(symbol_col, "")
                          ).strip()

                          if not raw_symbol:
                              continue

                          digits = (
                              "".join(
                                  ch for ch in raw_symbol
                                  if ch.isdigit()
                              )
                          )

                          if len(digits) != 6:
                              continue

                          ticker = f"{digits}.KS"

                          if ticker in seen:
                              continue

                          name = str(
                              row.get(name_col, digits)
                          ).strip()

                          # 일반 주식 중심의 KOSPI TOP 500.
                          # ETF/ETN/스팩 등 비주식성 상품은 제외합니다.
                          upper_name = name.upper()

                          if any(
                              token in upper_name
                              for token in [
                                  "ETF",
                                  "ETN",
                                  "스팩",
                                  "SPAC",
                              ]
                          ):
                              continue

                          result.append({
                              "ticker": ticker,
                              "name": name,
                              "nameKo": name,
                              "nameEn": name,
                              "market": "KOSPI",
                              "universe": "KOSPI500",
                          })

                          if len(result) >= 500:
                              break

                      if len(result) < 450:
                          raise RuntimeError(
                              f"KOSPI universe too small: {len(result)}"
                          )

                      print(
                          f"KOSPI universe loaded: {len(result)} symbols"
                      )

                      return result

                  except Exception as exc:
                      last_error = exc
                      print(
                          f"KOSPI listing attempt "
                          f"{attempt + 1}/3 failed: {exc}"
                      )
                      time.sleep(3 + attempt * 3)

              raise RuntimeError(
                  f"KOSPI TOP500 retrieval failed: {last_error}"
              )


          def download_csv(url):
              response = session.get(
                  url,
                  timeout=25,
              )
              response.raise_for_status()

              text = response.text

              if not text.strip():
                  raise RuntimeError("CSV is empty")

              return list(
                  csv.DictReader(
                      io.StringIO(text)
                  )
              )


          def load_nasdaq100():
              print("")
              print("=" * 70)
              print("NASDAQ-100")
              print("=" * 70)

              # 가장 최근 월별 snapshot을 먼저 시도하고,
              # 실패하면 안정적인 GitHub mirror로 fallback합니다.
              now = datetime.now(timezone.utc)

              candidates = []

              year = now.year
              month = now.month

              for _ in range(3):
                  candidates.append(
                      "https://raw.githubusercontent.com/"
                      "yfiua/index-constituents/main/docs/"
                      f"{year:04d}/{month:02d}/"
                      "constituents-nasdaq100.csv"
                  )

                  month -= 1
                  if month == 0:
                      month = 12
                      year -= 1

              candidates.append(
                  "https://raw.githubusercontent.com/"
                  "Gary-Strauss/NASDAQ100_Constituents/"
                  "master/data/nasdaq100_constituents.csv"
              )

              last_error = None

              for url in candidates:
                  try:
                      rows = download_csv(url)

                      result = []

                      for row in rows:
                          ticker = (
                              row.get("Symbol")
                              or row.get("Ticker")
                              or row.get("ticker")
                              or ""
                          ).strip().upper()

                          name = (
                              row.get("Name")
                              or row.get("Company")
                              or ""
                          ).strip()

                          if not ticker:
                              continue

                          # Yahoo ticker 변환.
                          # NASDAQ-100의 미국 상장 종목은 대부분 그대로 사용.
                          # 일부 클래스 티커가 있더라도 Yahoo에서
                          # 실패하면 해당 종목만 failedSymbols로 남깁니다.
                          result.append({
                              "ticker": ticker,
                              "name": name or ticker,
                              "nameKo": name or ticker,
                              "nameEn": name or ticker,
                              "market": "NASDAQ",
                              "universe": "NASDAQ100",
                          })

                      # 중복 제거
                      unique = {}
                      for item in result:
                          unique[item["ticker"]] = item

                      result = list(unique.values())

                      if len(result) < 90:
                          raise RuntimeError(
                              f"NASDAQ-100 universe too small: "
                              f"{len(result)}"
                          )

                      print(
                          f"NASDAQ-100 universe loaded: "
                          f"{len(result)} symbols"
                      )

                      return result

                  except Exception as exc:
                      last_error = exc
                      print(
                          f"NASDAQ source failed: "
                          f"{url} | {exc}"
                      )

              raise RuntimeError(
                  f"NASDAQ-100 constituent retrieval failed: "
                  f"{last_error}"
              )


          # ------------------------------------------------------------
          # 1. 관심종목 / 사용자 지정 지수
          # ------------------------------------------------------------
          watchlist, watch_indices = load_watchlist()

          # ------------------------------------------------------------
          # 2. 자동 Universe
          # ------------------------------------------------------------
          kospi500 = load_kospi_top500()
          nasdaq100 = load_nasdaq100()

          # ------------------------------------------------------------
          # 3. 관심종목을 우선으로 합치고 ticker 중복 제거
          # ------------------------------------------------------------
          stock_map = {}

          for item in watchlist:
              stock_map[item["ticker"].upper()] = item

          for item in kospi500:
              key = item["ticker"].upper()

              if key not in stock_map:
                  stock_map[key] = item
              else:
                  # 관심종목 이름을 유지하되 universe 정보만 보강
                  stock_map[key]["universe"] = "WATCHLIST,KOSPI500"

          for item in nasdaq100:
              key = item["ticker"].upper()

              if key not in stock_map:
                  stock_map[key] = item
              else:
                  if stock_map[key].get("universe") == "WATCHLIST":
                      stock_map[key]["universe"] = (
                          "WATCHLIST,NASDAQ100"
                      )

          all_stocks = list(stock_map.values())

          print("")
          print("=" * 70)
          print(f"TOTAL UNIQUE STOCKS: {len(all_stocks)}")
          print("=" * 70)

          # ------------------------------------------------------------
          # 4. 주요 지수
          # ------------------------------------------------------------
          major_indices = [
              {
                  "ticker": "^GSPC",
                  "name": "S&P 500",
                  "nameKo": "S&P 500",
                  "nameEn": "S&P 500",
                  "market": "INDEX",
              },
              {
                  "ticker": "^IXIC",
                  "name": "NASDAQ",
                  "nameKo": "NASDAQ",
                  "nameEn": "NASDAQ Composite",
                  "market": "INDEX",
              },
              {
                  "ticker": "^NDX",
                  "name": "NASDAQ 100",
                  "nameKo": "나스닥 100",
                  "nameEn": "NASDAQ 100",
                  "market": "INDEX",
              },
              {
                  "ticker": "^KS11",
                  "name": "KOSPI",
                  "nameKo": "코스피",
                  "nameEn": "KOSPI",
                  "market": "INDEX",
              },
              {
                  "ticker": "^KS200",
                  "name": "KOSPI 200",
                  "nameKo": "코스피 200",
                  "nameEn": "KOSPI 200",
                  "market": "INDEX",
              },
          ]

          index_map = {
              item["ticker"]: item
              for item in major_indices
          }

          for item in watch_indices:
              index_map[item["ticker"]] = item

          # ------------------------------------------------------------
          # 5. VIX
          # ------------------------------------------------------------
          try:
              vix = get_chart("^VIX")
              vix_output = {
                  "price": vix["price"],
                  "history": [
                      x["close"]
                      for x in vix["rows"][-60:]
                  ],
              }
              print(f"VIX = {vix_output['price']}")
          except Exception as exc:
              print(f"VIX ERROR | {exc}")
              vix_output = {
                  "price": None,
                  "history": [],
                  "error": str(exc),
              }

          # ------------------------------------------------------------
          # 6. 주요 지수 처리
          # ------------------------------------------------------------
          indices_output = {}

          for ticker, item in index_map.items():
              result = build_symbol({
                  **item,
                  "universe": "INDEX",
              })
              indices_output[ticker] = result
              print(
                  f"INDEX | {ticker} | {result.get('price')}"
              )

          # ------------------------------------------------------------
          # 7. 600개 이상 종목 처리
          # ------------------------------------------------------------
          stocks_output = {}
          completed = 0

          with ThreadPoolExecutor(
              max_workers=MAX_WORKERS
          ) as executor:

              futures = {
                  executor.submit(
                      build_symbol,
                      item,
                  ): item
                  for item in all_stocks
              }

              for future in as_completed(futures):
                  item = futures[future]

                  try:
                      result = future.result()
                  except Exception as exc:
                      result = {
                          "ticker": item["ticker"],
                          "name": item["name"],
                          "nameKo": item["nameKo"],
                          "nameEn": item["nameEn"],
                          "market": item["market"],
                          "universe": item["universe"],
                          "price": None,
                          "daily": {
                              "middle": None,
                              "upper": None,
                              "lower": None,
                          },
                          "weekly": {
                              "middle": None,
                              "upper": None,
                              "lower": None,
                          },
                          "dataPoints": 0,
                          "error": str(exc),
                      }

                  stocks_output[item["ticker"]] = result
                  completed += 1

                  if completed % 25 == 0:
                      print(
                          f"Progress: "
                          f"{completed}/{len(all_stocks)}"
                      )

          # ------------------------------------------------------------
          # 8. 최종 JSON
          # ------------------------------------------------------------
          successful = sum(
              1
              for item in stocks_output.values()
              if item.get("price") is not None
          )

          failed = len(stocks_output) - successful

          output = {
              "generatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),

              "vix": vix_output,

              "indices": indices_output,

              "stocks": stocks_output,

              "universes": {
                  "watchlist": [
                      x["ticker"]
                      for x in watchlist
                  ],
                  "kospi500": [
                      x["ticker"]
                      for x in kospi500
                  ],
                  "nasdaq100": [
                      x["ticker"]
                      for x in nasdaq100
                  ],
              },

              "summary": {
                  "watchlistSymbols": len(watchlist),
                  "kospi500Symbols": len(kospi500),
                  "nasdaq100Symbols": len(nasdaq100),
                  "totalUniqueSymbols": len(stocks_output),
                  "successfulSymbols": successful,
                  "failedSymbols": failed,
                  "bbPeriod": BB_PERIOD,
                  "bbMultiplier": BB_MULTIPLIER,
              },
          }

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          print("")
          print("=" * 70)
          print("UPDATE COMPLETE")
          print("=" * 70)
          print(
              f"Watchlist       : {len(watchlist)}"
          )
          print(
              f"KOSPI TOP500    : {len(kospi500)}"
          )
          print(
              f"NASDAQ-100      : {len(nasdaq100)}"
          )
          print(
              f"Unique stocks    : {len(stocks_output)}"
          )
          print(
              f"Successful       : {successful}"
          )
          print(
              f"Failed           : {failed}"
          )
          print("=" * 70)

          PY

      - name: Validate market data
        run: |
          python - <<'PY'
          import json

          with open(
              "market-data.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          required = [
              "generatedAt",
              "vix",
              "indices",
              "stocks",
              "universes",
              "summary",
          ]

          for key in required:
              assert key in data, f"Missing key: {key}"

          assert len(data["universes"]["kospi500"]) >= 450
          assert len(data["universes"]["nasdaq100"]) >= 90

          print("market-data.json validation OK")
          print(
              "KOSPI500:",
              len(data["universes"]["kospi500"]),
          )
          print(
              "NASDAQ100:",
              len(data["universes"]["nasdaq100"]),
          )
          print(
              "Unique stocks:",
              len(data["stocks"]),
          )
          print(
              "Indices:",
              len(data["indices"]),
          )
          print(
              "Successful:",
              data["summary"]["successfulSymbols"],
          )
          print(
              "Failed:",
              data["summary"]["failedSymbols"],
          )
          PY

      - name: Commit market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add market-data.json

          if git diff --cached --quiet; then
            echo "No market data changes."
          else
            git commit -m "Update market data"
            git push
          fi
